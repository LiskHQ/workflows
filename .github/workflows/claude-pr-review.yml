name: Claude PR Code Review (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: string
      track_progress:
        description: 'Enable progress tracking'
        required: false
        type: boolean
        default: false
      repository:
        description: 'Repository name (owner/repo)'
        required: true
        type: string
      model:
        description: 'Claude model to use (sonnet, opus, haiku)'
        required: false
        type: string
        default: 'sonnet'
    secrets:
      anthropic_api_key:
        description: 'Claude Code API key'
        required: true

jobs:
  # ──────────────────────────────────────────────
  # Step 1: Compute diff size and decide strategy
  # ──────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      diff_size: ${{ steps.diff-size.outputs.size }}
      total_lines: ${{ steps.diff-size.outputs.total_lines }}
      review_mode: ${{ steps.diff-size.outputs.review_mode }}
      model_id: ${{ steps.model-config.outputs.model_id }}
      findings_schema: ${{ steps.schema.outputs.findings_schema }}
    steps:
      - name: Set model identifier
        id: model-config
        run: |
          case "${{ inputs.model }}" in
            opus) MODEL_ID="opus" ;;
            haiku) MODEL_ID="haiku" ;;
            sonnet|*) MODEL_ID="sonnet" ;;
          esac
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT

      - name: Build findings JSON schema
        id: schema
        run: |
          # Canonical schema shared by all review agents. Keep in sync with
          # .github/review-agents/*.md output contracts.
          SCHEMA=$(jq -c . <<'JSON'
          {
            "type": "object",
            "properties": {
              "findings": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "category": { "type": "string" },
                    "file": { "type": "string" },
                    "line": { "type": "integer" },
                    "summary": { "type": "string" },
                    "evidence": { "type": "string" },
                    "severity": { "type": "string", "enum": ["Critical", "High", "Medium"] },
                    "confidence": { "type": "string", "enum": ["Certain", "Likely", "Possible"] },
                    "fix": { "type": "string" }
                  },
                  "required": ["category", "file", "line", "summary", "evidence", "severity", "confidence", "fix"]
                }
              }
            },
            "required": ["findings"]
          }
          JSON
          )
          echo "findings_schema=$SCHEMA" >> "$GITHUB_OUTPUT"

      - name: Compute diff size
        id: diff-size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh pr view ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --json additions,deletions)
          ADDITIONS=$(echo "$PR_JSON" | jq '.additions')
          DELETIONS=$(echo "$PR_JSON" | jq '.deletions')
          TOTAL=$((ADDITIONS + DELETIONS))

          if [ "$TOTAL" -lt 50 ]; then
            SIZE="small"
            MODE="single"
          elif [ "$TOTAL" -lt 500 ]; then
            SIZE="medium"
            MODE="multi"
          else
            SIZE="large"
            MODE="multi"
          fi

          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "total_lines=$TOTAL" >> $GITHUB_OUTPUT
          echo "review_mode=$MODE" >> $GITHUB_OUTPUT
          echo "Diff: $SIZE ($TOTAL lines) -> mode: $MODE"

  # ──────────────────────────────────────────────
  # Step 2a: Single-agent review (small PRs < 50 lines)
  # ──────────────────────────────────────────────
  review-single:
    needs: prepare
    if: needs.prepare.outputs.review_mode == 'single'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Perform Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          track_progress: ${{ inputs.track_progress }}
          use_sticky_comment: true
          claude_args: '--model ${{ needs.prepare.outputs.model_id }} --allowed-tools "Glob,Grep,Read,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*)"'
          prompt: |
            REPO: ${{ inputs.repository }}
            PR NUMBER: ${{ inputs.pr_number }}
            DIFF SIZE: ${{ needs.prepare.outputs.diff_size }} (${{ needs.prepare.outputs.total_lines }} lines changed)
            REVIEW DEPTH: quick

            You are an expert code reviewer. Your goal: identify real, high-impact issues while avoiding false positives. Severity is consequence-based — a naming issue that causes misuse is worse than a missing edge case that never triggers.

            ---

            ## PHASE 1: GATHER CONTEXT

            **Step 1: PR Information**
            ```bash
            gh pr view ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --json title,body,files,additions,deletions,labels
            ```
            ```bash
            gh pr diff ${{ inputs.pr_number }} --repo ${{ inputs.repository }}
            ```

            **Step 2: Project Conventions**
            - Read all CLAUDE.md files in the repo (root and subdirectories). For each guideline, verify the PR changes comply. Cite the specific CLAUDE.md rule for any violation.
            - Check package.json, Cargo.toml, go.mod, or pyproject.toml for framework context.

            ---

            ## PHASE 2: QUICK REVIEW

            This is a small PR (<50 lines). Do a quick scan focused on obvious bugs, security issues, and correctness problems. Skip minor issues.

            Review categories (skip any that don't apply):
            1. **Correctness** — data flow, off-by-one, inverted conditions, async ordering, deletion safety
            2. **Framework Behavior** — middleware ordering, unchecked return values, config drift
            3. **Edge Cases** — empty input, boundary values, type coercion
            4. **Error Handling** — silent failures, missing cleanup
            5. **Security** — injection, auth gaps, hardcoded secrets, data exposure (only with plausible attack vector)
            6. **Tests** — meaningful assertions, error path coverage

            ---

            ## FALSE POSITIVE FILTER — DO NOT FLAG

            1. Pre-existing issues in code NOT touched by the diff
            2. Style preferences without established project convention
            3. Issues a linter, typechecker, or compiler would catch
            4. Theoretical security without plausible attack vector
            5. Missing features not in PR description
            6. Personal language/framework preferences
            7. Trivial naming disagreements
            8. Test coverage maximalism
            9. Infallible operations (map lookup by key just inserted)
            10. Calls inside already-bounded contexts
            11. Pure delegation functions
            12. Pedantic nitpicks a senior engineer wouldn't call out
            13. Issues silenced by lint-ignore comments

            ---

            ## OUTPUT FORMAT

            **Use inline comments for code-specific issues:**
            - Use `mcp__github_inline_comment__create_inline_comment` for issues tied to specific lines
            - Use `gh pr comment --repo ${{ inputs.repository }}` for the summary

            Post review as a PR comment:

            ```markdown
            ## Code Review

            ### CLAUDE.md Compliance
            [Any violations citing the specific rule. If none: "No violations found."]

            ### Findings

            <table><thead><tr><td><strong>Category</strong></td><td align=left><strong>Finding</strong></td><td align=center><strong>Severity</strong></td><td align=center><strong>Confidence</strong></td></tr></thead><tbody>

            <tr><td>[Category]</td>
            <td>

            <details><summary>[One sentence summary]</summary>

            ___

            **Problem:** [Concrete evidence from the code]

            **Why it matters:** [Impact]

            **Proposed fix:** [Specific solution]

            `[file_path]:[line_start]-[line_end]`

            ```diff
            -[existing_code]
            +[improved_code]
            ```

            </details></td>
            <td align=center>[Critical/High/Medium]</td>
            <td align=center>[Certain/Likely/Possible]</td>
            </tr>

            </tbody></table>

            ### Verdict

            **VERDICT: PASS** or **VERDICT: FAIL**

            - Any Critical or High with Certain or Likely confidence = **FAIL**
            - Only Medium or no findings = **PASS**
            ```

            **If no issues:** Post `## Code Review\n\n**VERDICT: PASS**\n\nNo significant issues found.`

            ---

            ## SEVERITY (Consequence-Based)
            - **Critical**: Will crash, security vulnerability, data loss, broken user flow
            - **High**: Performance degradation, likely bugs under certain conditions
            - **Medium**: Maintainability concerns, unlikely edge cases

            ## RULES
            1. Every finding must cite `file:line` with evidence
            2. Trace data flow before flagging uncertain issues
            3. Show concrete before/after code
            4. One finding per issue, keep explanations concise
            5. Don't report uncertain issues as critical

  # ──────────────────────────────────────────────
  # Step 2b: Multi-agent review (medium/large PRs)
  # 4 parallel specialized agents
  # ──────────────────────────────────────────────
  review-correctness:
    needs: prepare
    if: needs.prepare.outputs.review_mode == 'multi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      findings: ${{ steps.review.outputs.structured_output }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout workflow repo for agent prompts
        uses: actions/checkout@v4
        with:
          repository: LiskHQ/workflows
          path: .workflow-repo
          sparse-checkout: .github/review-agents

      - name: Read agent prompt
        id: prompt
        run: |
          AGENT_PROMPT=$(cat .workflow-repo/.github/review-agents/correctness.md)
          {
            echo "agent_prompt<<AGENT_EOF"
            echo "$AGENT_PROMPT"
            echo "AGENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Review - Correctness
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_args: |
            --model ${{ needs.prepare.outputs.model_id }}
            --allowed-tools "Glob,Read,Grep,Bash(gh pr view:*),Bash(gh pr diff:*)"
            --json-schema '${{ needs.prepare.outputs.findings_schema }}'
          prompt: |
            REPO: ${{ inputs.repository }}
            PR NUMBER: ${{ inputs.pr_number }}
            DIFF SIZE: ${{ needs.prepare.outputs.diff_size }} (${{ needs.prepare.outputs.total_lines }} lines)

            ## Instructions

            ${{ steps.prompt.outputs.agent_prompt }}

            ## Steps

            1. Get the PR diff:
            ```bash
            gh pr diff ${{ inputs.pr_number }} --repo ${{ inputs.repository }}
            ```

            2. Get PR details:
            ```bash
            gh pr view ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --json title,body,files
            ```

            3. Read the full content of each changed file (not just the diff).

            4. Apply your review criteria.

            Your final answer must be a JSON object matching the schema: `{ "findings": [ ... ] }`. If no issues, return `{ "findings": [] }`.

      - name: Log findings count
        if: always()
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$OUT" ]; then
            echo "correctness: no structured_output (agent failed or schema rejected)"
          else
            COUNT=$(printf '%s' "$OUT" | jq -r '.findings | length')
            echo "correctness findings: $COUNT"
          fi

  review-consistency:
    needs: prepare
    if: needs.prepare.outputs.review_mode == 'multi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      findings: ${{ steps.review.outputs.structured_output }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout workflow repo for agent prompts
        uses: actions/checkout@v4
        with:
          repository: LiskHQ/workflows
          path: .workflow-repo
          sparse-checkout: .github/review-agents

      - name: Read agent prompt
        id: prompt
        run: |
          AGENT_PROMPT=$(cat .workflow-repo/.github/review-agents/consistency.md)
          {
            echo "agent_prompt<<AGENT_EOF"
            echo "$AGENT_PROMPT"
            echo "AGENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Review - Consistency
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_args: |
            --model ${{ needs.prepare.outputs.model_id }}
            --allowed-tools "Glob,Read,Grep,Bash(gh pr view:*),Bash(gh pr diff:*)"
            --json-schema '${{ needs.prepare.outputs.findings_schema }}'
          prompt: |
            REPO: ${{ inputs.repository }}
            PR NUMBER: ${{ inputs.pr_number }}
            DIFF SIZE: ${{ needs.prepare.outputs.diff_size }} (${{ needs.prepare.outputs.total_lines }} lines)

            ## Instructions

            ${{ steps.prompt.outputs.agent_prompt }}

            ## Steps

            1. Get the PR diff:
            ```bash
            gh pr diff ${{ inputs.pr_number }} --repo ${{ inputs.repository }}
            ```

            2. Get PR details:
            ```bash
            gh pr view ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --json title,body,files
            ```

            3. Read the full content of each changed file.
            4. Read all CLAUDE.md files in the repo for project conventions.
            5. Apply your review criteria.

            Your final answer must be a JSON object matching the schema: `{ "findings": [ ... ] }`. If no issues, return `{ "findings": [] }`.

      - name: Log findings count
        if: always()
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$OUT" ]; then
            echo "consistency: no structured_output (agent failed or schema rejected)"
          else
            COUNT=$(printf '%s' "$OUT" | jq -r '.findings | length')
            echo "consistency findings: $COUNT"
          fi

  review-security-design:
    needs: prepare
    if: needs.prepare.outputs.review_mode == 'multi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      findings: ${{ steps.review.outputs.structured_output }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout workflow repo for agent prompts
        uses: actions/checkout@v4
        with:
          repository: LiskHQ/workflows
          path: .workflow-repo
          sparse-checkout: .github/review-agents

      - name: Read agent prompt
        id: prompt
        run: |
          AGENT_PROMPT=$(cat .workflow-repo/.github/review-agents/security-design.md)
          {
            echo "agent_prompt<<AGENT_EOF"
            echo "$AGENT_PROMPT"
            echo "AGENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Review - Security & Design
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_args: |
            --model ${{ needs.prepare.outputs.model_id }}
            --allowed-tools "Glob,Read,Grep,Bash(gh pr view:*),Bash(gh pr diff:*)"
            --json-schema '${{ needs.prepare.outputs.findings_schema }}'
          prompt: |
            REPO: ${{ inputs.repository }}
            PR NUMBER: ${{ inputs.pr_number }}
            DIFF SIZE: ${{ needs.prepare.outputs.diff_size }} (${{ needs.prepare.outputs.total_lines }} lines)

            ## Instructions

            ${{ steps.prompt.outputs.agent_prompt }}

            ## Steps

            1. Get the PR diff:
            ```bash
            gh pr diff ${{ inputs.pr_number }} --repo ${{ inputs.repository }}
            ```

            2. Get PR details:
            ```bash
            gh pr view ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --json title,body,files
            ```

            3. Read the full content of each changed file.
            4. Apply your review criteria.

            Your final answer must be a JSON object matching the schema: `{ "findings": [ ... ] }`. If no issues, return `{ "findings": [] }`.

      - name: Log findings count
        if: always()
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$OUT" ]; then
            echo "security-design: no structured_output (agent failed or schema rejected)"
          else
            COUNT=$(printf '%s' "$OUT" | jq -r '.findings | length')
            echo "security-design findings: $COUNT"
          fi

  review-git-history:
    needs: prepare
    if: needs.prepare.outputs.review_mode == 'multi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      findings: ${{ steps.review.outputs.structured_output }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for blame/log

      - name: Checkout workflow repo for agent prompts
        uses: actions/checkout@v4
        with:
          repository: LiskHQ/workflows
          path: .workflow-repo
          sparse-checkout: .github/review-agents

      - name: Read agent prompt
        id: prompt
        run: |
          AGENT_PROMPT=$(cat .workflow-repo/.github/review-agents/git-history.md)
          {
            echo "agent_prompt<<AGENT_EOF"
            echo "$AGENT_PROMPT"
            echo "AGENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Review - Git History
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_args: |
            --model ${{ needs.prepare.outputs.model_id }}
            --allowed-tools "Glob,Read,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git log:*),Bash(git blame:*)"
            --json-schema '${{ needs.prepare.outputs.findings_schema }}'
          prompt: |
            REPO: ${{ inputs.repository }}
            PR NUMBER: ${{ inputs.pr_number }}
            DIFF SIZE: ${{ needs.prepare.outputs.diff_size }} (${{ needs.prepare.outputs.total_lines }} lines)

            ## Instructions

            ${{ steps.prompt.outputs.agent_prompt }}

            ## Steps

            1. Get the PR diff:
            ```bash
            gh pr diff ${{ inputs.pr_number }} --repo ${{ inputs.repository }}
            ```

            2. Get list of changed files:
            ```bash
            gh pr view ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --json files --jq '.files[].path'
            ```

            3. For each changed file, run git log and git blame on the modified sections.

            4. Apply your review criteria.

            Your final answer must be a JSON object matching the schema: `{ "findings": [ ... ] }`. If no historically relevant issues, return `{ "findings": [] }`.

      - name: Log findings count
        if: always()
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$OUT" ]; then
            echo "git-history: no structured_output (agent failed or schema rejected)"
          else
            COUNT=$(printf '%s' "$OUT" | jq -r '.findings | length')
            echo "git-history findings: $COUNT"
          fi

  # ──────────────────────────────────────────────
  # Step 3: Aggregate findings from all agents
  # ──────────────────────────────────────────────
  aggregate:
    needs:
      - prepare
      - review-correctness
      - review-consistency
      - review-security-design
      - review-git-history
    if: needs.prepare.outputs.review_mode == 'multi' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout workflow repo for agent prompts
        uses: actions/checkout@v4
        with:
          repository: LiskHQ/workflows
          path: .workflow-repo
          sparse-checkout: .github/review-agents

      - name: Read aggregator prompt
        id: prompt
        run: |
          AGENT_PROMPT=$(cat .workflow-repo/.github/review-agents/aggregator.md)
          {
            echo "agent_prompt<<AGENT_EOF"
            echo "$AGENT_PROMPT"
            echo "AGENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Aggregate and Post Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          track_progress: ${{ inputs.track_progress }}
          use_sticky_comment: true
          claude_args: '--model ${{ needs.prepare.outputs.model_id }} --allowed-tools "Glob,Read,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
          prompt: |
            REPO: ${{ inputs.repository }}
            PR NUMBER: ${{ inputs.pr_number }}
            DIFF SIZE: ${{ needs.prepare.outputs.diff_size }} (${{ needs.prepare.outputs.total_lines }} lines)

            ## Instructions

            ${{ steps.prompt.outputs.agent_prompt }}

            ## Agent Findings

            ### Correctness Agent
            ```json
            ${{ needs.review-correctness.outputs.findings || '{"findings":[]}'}}
            ```

            ### Consistency Agent
            ```json
            ${{ needs.review-consistency.outputs.findings || '{"findings":[]}'}}
            ```

            ### Security & Design Agent
            ```json
            ${{ needs.review-security-design.outputs.findings || '{"findings":[]}'}}
            ```

            ### Git History Agent
            ```json
            ${{ needs.review-git-history.outputs.findings || '{"findings":[]}'}}
            ```

            ## Your Task

            1. Parse all agent findings above
            2. Deduplicate findings with same file:line and root cause
            3. Score each finding using the confidence rubric (0-100) — read actual code to verify
            4. Apply corroboration bonus (+20 for findings flagged by 2+ agents)
            5. Classify: score >= 80 = MUST_FIX, 40-79 = SUGGESTION, < 40 = DROP
            6. Apply the false positive filter one final time
            7. Post the unified review comment using `gh pr comment --repo ${{ inputs.repository }}`
            8. Post inline comments for each finding with specific file/line
