name: Claude PR Summary (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: string
      repository:
        description: 'Repository name (owner/repo)'
        required: true
        type: string
    secrets:
      anthropic_api_key:
        description: 'Claude Code API key'
        required: true

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate PR Summary
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          track_progress: false
          use_sticky_comment: false
          claude_args: '--model haiku --allowed-tools "Glob,Read,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*)"'
          prompt: |
            REPO: ${{ inputs.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            **YOUR TASK:**

            Generate a concise, technical summary of this pull request.

            Use CLAUDE.md if it exists to understand the repository context and what areas to highlight.

            **STEP 1: Gather PR Information**

            Get PR metadata:
            ```bash
            gh pr view ${{ inputs.pr_number }} --json title,body,files,additions,deletions
            ```

            Examine code changes:
            ```bash
            gh pr diff ${{ inputs.pr_number }}
            ```

            **STEP 2: Analyze Changes**

            Assess the following:
            - What functionality is being added/modified/removed?
            - How many files and lines changed?
            - Are there any breaking changes?
            - Code quality (type safety, patterns, best practices)
            - Complexity level:
              * Simple: <100 lines, single component/feature
              * Medium: 100-300 lines, multiple files, moderate scope
              * Complex: >300 lines, architectural changes, cross-cutting concerns

            **STEP 3: Generate Summary**

            Create a summary following this structure (max 150 words total):

            ```
            ## 📋 PR Summary

            **Generated:** [timestamp]

            ### Overview
            [2-3 sentences: what does this PR do and why?]

            ### Key Changes
            - [Main change 1]
            - [Main change 2]
            - [Main change 3 if applicable]

            ### Impact Assessment
            - **Files Changed**: [number]
            - **Lines**: +[additions] -[deletions]
            - **Areas**: [list main areas/modules affected based on CLAUDE.md context if available]
            - **Breaking Changes**: [Yes/No - if yes, explain briefly]

            ### Technical Assessment
            - **Complexity**: [Simple/Medium/Complex - 1 line reason]
            - **Code Quality**: [Assessment based on codebase standards]
            - **Risk Level**: [Low/Medium/High - 1 line reason]

            ---

            *For detailed code review, comment `/review` on this PR*
            ```

            **STEP 4: Update PR Description**

            You must update the PR description by making **separate, sequential tool calls** (one command per call).
            Do NOT combine commands into a single bash script with shell variables.

            **Step 4a:** Read the current PR body:
            ```bash
            gh pr view ${{ inputs.pr_number }} --json body --jq '.body // ""'
            ```

            **Step 4b:** Construct the updated body in your context (no tool call needed):
            - If the body contains `<!-- CLAUDE_SUMMARY_START -->`, remove everything from `---` before that marker through `<!-- CLAUDE_SUMMARY_END -->` (inclusive)
            - Append the new summary block to the cleaned body using this structure:

            ```
            [cleaned original body]

            ---

            <!-- CLAUDE_SUMMARY_START -->
            [your generated summary from Step 3]
            <!-- CLAUDE_SUMMARY_END -->
            ```

            **Step 4c:** Update the PR with a single `gh pr edit` command. Use single quotes for the --body value
            to avoid issues with double quotes in the content. Escape any single quotes in the body with '\'' :
            ```bash
            gh pr edit ${{ inputs.pr_number }} --body '[full body content here]'
            ```

            **IMPORTANT GUIDELINES:**

            - **Each tool call must be a single command** - no shell variables, pipes, or compound scripts
            - **NEVER use temp files, --body-file, or /tmp** - pass body content directly via --body
            - **Use single quotes** for the --body argument to avoid double-quote escaping issues
            - Keep the summary concise: max 150 words
            - Focus on WHAT changed and WHY, not code review feedback
            - Use the Glob tool to check if CLAUDE.md exists, then Read it for context
            - Highlight breaking changes prominently
            - Use technical language appropriate for developers
            - No code suggestions - this is informational only
